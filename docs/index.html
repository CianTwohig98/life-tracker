<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Life Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{--bg:#0e1013;--p1:#14171c;--p2:#1a1e24;--line:#2a2f37;--line2:#3a414b;--tx:#d9dde3;--mu:#8a929e;--ac:#7aa7d9;--ok:#6fae7e;--warn:#c9a25a;--bad:#c97a7a}
*{box-sizing:border-box}
html{background:#0e1013}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
small,.mu{color:var(--mu)}
h1,h2,h3,h4{margin:0;font-weight:600}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:12px;font-weight:600}
h3{font-size:12px}
#app{max-width:1180px;margin:0 auto;padding:16px 16px 80px}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.brand{font-size:15px;font-weight:700;letter-spacing:.02em}
.brand span{color:var(--mu);font-weight:400}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button,.datenav input{background:var(--p2);border:1px solid var(--line);border-radius:2px;padding:5px 10px}
.datenav .today{border-color:var(--ac);color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--p1);border:1px solid var(--line);border-radius:2px;padding:4px 10px;color:var(--mu)}
.chip b{color:var(--tx);margin-left:6px}
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 16px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--mu);white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--p1);border:1px solid var(--line);border-radius:2px;padding:14px}
.card.flat{background:var(--p1)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.note{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:2px;padding:8px 12px;margin-bottom:10px;background:var(--p1)}
.note.warn{border-left-color:var(--warn)}
.note.good{border-left-color:var(--ok)}
.note.info{border-left-color:var(--ac)}
.banner{border:1px solid var(--line2);border-radius:2px;padding:8px 12px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--p2)}
.btn{background:var(--p2);border:1px solid var(--line2);border-radius:2px;padding:6px 12px}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0b1016;font-weight:600}
.btn.pri:hover{background:#8db6e3}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{border-color:#7a4545;color:#d9a0a0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sec{margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px}
.sec h2{margin:0}
.need{margin-bottom:10px}
.nh{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px}
.bar{height:8px;background:#0a0c0f;border:1px solid var(--line);border-radius:0;overflow:hidden}
.bar>i{display:block;height:100%}
.bar.hi>i{background:var(--ok)}
.bar.mid>i{background:var(--warn)}
.bar.lo>i{background:var(--bad)}
.bar.thin{height:5px}
.bar.sk>i{background:var(--ac)}
.bar.empty{opacity:.4}
.skill{padding:10px 12px}
.sh{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.sh>div:first-child{flex:1;line-height:1.3}
.sh small{display:block}
.lv{font-size:20px;font-weight:700;min-width:2ch;text-align:right}
.sf{display:flex;justify-content:space-between;color:var(--mu);margin-top:5px;font-size:12px}
.up{color:var(--ok)}.dn{color:var(--bad)}.pos{color:var(--ok)}.neg{color:var(--bad)}
.badge{display:inline-block;border:1px solid var(--line2);border-radius:2px;padding:1px 7px;font-size:11px;color:var(--mu)}
.badge.fun{color:#b7a3d6;border-color:#5b4d78}.badge.rest{color:#8fb7d6;border-color:#4a6a82}.badge.mode{color:var(--warn);border-color:#7a6535}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;background:#2a2f37;display:inline-block}
.dot.on{background:var(--ok)}.dot.miss{background:var(--bad)}
.goal{margin-bottom:9px}
.chart{width:100%;height:120px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin-top:4px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle}
.slots{display:flex;gap:6px;margin-bottom:12px}
.slots button{flex:1;background:var(--p1);border:1px solid var(--line);border-radius:2px;padding:9px;display:flex;gap:8px;align-items:center;justify-content:center}
.slots button.on{border-color:var(--ac);color:var(--ac)}
.grp{margin-bottom:14px}
.grp>h3{margin:2px 0 6px;color:var(--mu);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.ind{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--p1);border:1px solid var(--line);border-radius:2px;padding:8px 10px;margin-bottom:6px}
.il{min-width:190px;flex:1 1 220px}
.il b{display:block;font-weight:600}.il small{display:block;line-height:1.3}
.ctl{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex:2 1 280px}
.ctl .full{flex-basis:100%;display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ctl textarea{width:100%;min-height:54px;resize:vertical}
.chp{background:var(--p2);border:1px solid var(--line);border-radius:2px;padding:4px 9px}
.chp:hover{border-color:var(--line2)}
.chp.on{border-color:var(--ac);color:var(--ac);background:#161d27}
.chp.bad.on{border-color:var(--bad);color:var(--bad);background:#241818}
.chp.r{min-width:28px;text-align:center;padding:4px 6px}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=time],input[type=date],select,textarea{background:#0b0d10;border:1px solid var(--line);border-radius:2px;padding:5px 8px}
input[type=number]{width:84px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:1px solid var(--ac);outline-offset:0}
.xp{font-weight:700;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.xp.p{color:var(--ok)}.xp.n{color:var(--bad)}.xp.z{color:var(--mu)}
.unit{color:var(--mu);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
td.wrap{white-space:normal;text-align:left;color:var(--mu);min-width:220px;max-width:420px}
tr.gh td{color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-size:11px;background:var(--p2);text-align:left}
td.lvl{font-weight:700}
.scroll{overflow-x:auto}
.quest{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .qb{flex:1 1 240px}
.persona{border:1px solid var(--line);border-radius:2px;padding:8px 10px;background:var(--p1);text-align:left}
.persona.on{border-color:var(--ac)}
.persona b{display:block}
.ov{position:fixed;inset:0;background:rgba(6,8,10,.8);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto;z-index:50}
.md{background:var(--p2);border:1px solid var(--line2);border-radius:2px;padding:18px;width:min(580px,100%)}
.md h2{font-size:13px;color:var(--tx)}
.fld{display:grid;grid-template-columns:160px 1fr;gap:6px 10px;align-items:center;margin:10px 0}
.fld label{color:var(--mu)}
.fld input[type=text],.fld input[type=email],.fld input[type=password],.fld input[type=number],.fld select{width:100%}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--ac);padding:8px 16px;border-radius:2px;opacity:0;z-index:60;pointer-events:none}
#toast.show{opacity:1}
.sum{padding:0;margin:8px 0}
.sum li{display:flex;justify-content:space-between;gap:20px;padding:3px 0;list-style:none;border-bottom:1px solid var(--line)}
.big{font-size:26px;font-weight:700;margin:4px 0}
.lvup{border:1px solid var(--ok);border-radius:2px;padding:6px 10px;margin:6px 0;color:var(--ok)}
.state{font-size:11px;color:var(--mu);margin-left:6px}
.sumline{font-size:14px;margin:0 0 10px;color:var(--tx)}
.recs{list-style:none;padding:0;margin:0}
.recs li{display:flex;gap:10px;padding:4px 0;border-top:1px solid var(--line)}
.recs .tag{flex:0 0 120px;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:1px}
.rm{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;margin-bottom:5px}
.rm.low .nm{color:var(--bad)}
.sub{flex-basis:100%;display:flex;gap:5px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.hint{color:var(--mu);font-size:12px;margin:6px 0 0}
@media (max-width:640px){#app{padding:10px 10px 80px}.fld{grid-template-columns:1fr}.ctl{justify-content:flex-start}.recs .tag{flex-basis:84px}}
.nh>b{white-space:nowrap}
select,input,textarea{max-width:100%}.card,.ind{min-width:0}.md{max-width:100%}
body{overflow-x:hidden}
.stag{display:inline-block;min-width:20px;text-align:center;border:1px solid var(--line2);color:var(--mu);padding:0 5px;font-size:11px}
.stag.on{border-color:var(--sc);color:var(--sc)}
.stag.miss{border-color:var(--bad);color:var(--bad)}
.slottags{display:flex;gap:4px}
.slots button{border-top:3px solid var(--line);flex-direction:column;gap:2px;align-items:center}
.slots button small{color:var(--mu);font-size:11px}
.slots button.on{border-top-color:var(--sc);color:var(--sc);border-color:var(--line2);border-top-color:var(--sc)}
.slotpane{border-top:3px solid var(--sc);padding-top:12px}
.slotlabel{color:var(--sc);text-transform:uppercase;letter-spacing:.08em;font-size:11px;margin-bottom:12px}
.ind{border-left:3px solid var(--gc,var(--line))}
.skill{border-left:3px solid var(--gc,var(--line))}
.bar.sk>i{background:var(--gc,var(--ac))}
.grp>h3 small{color:var(--mu);margin-left:8px;text-transform:none;letter-spacing:0;font-weight:400}
table.plan{margin:8px 0}
table.plan td{white-space:normal;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
table.plan td.tm{width:130px;white-space:nowrap;border-left:3px solid var(--gc,var(--line))}
table.plan td.tm small{color:var(--mu)}
table.plan td.tg{width:150px;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
table.plan tr.k-checkin td.tx,table.plan tr.k-wind td.tx{color:var(--mu)}
.rewards{margin-top:12px;border:1px solid var(--line2);padding:10px 12px;background:var(--p2)}
.rewards h2{margin-bottom:8px}
.rw{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:4px 0;flex-wrap:wrap}
.qd{display:block}
select[multiple]{width:100%}

.tin{width:96px;text-align:center}
small.any{color:var(--mu)}
.ptot{width:100%;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tt td,.tt th{padding:6px 8px;vertical-align:middle}.tt input{width:72px}
.tt tr{border-left:3px solid var(--gc,var(--line))}.tt .nm2{white-space:nowrap}
.gh2{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gc);border-bottom:1px solid var(--line);padding-bottom:4px}
.skgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.sk{background:var(--p1);border:1px solid var(--line);border-left:3px solid var(--gc);border-radius:2px;padding:12px;min-width:0}
.skh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.skn{font-weight:600}.skl{font-size:22px;font-weight:700;color:var(--gc)}.skl small{font-size:11px;font-weight:400}
.xpbar{height:12px;background:#0a0c0f;border:1px solid var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--ok)}
.xpbar.thin{height:6px;margin:4px 0}
.xpt{display:flex;justify-content:space-between;gap:8px;color:var(--mu);font-size:12px;margin-top:4px;flex-wrap:wrap;align-items:center}
.skstats{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;color:var(--mu);font-size:12px}.skstats b{color:var(--tx)}.skstats b.up,.up{color:var(--ok)}.skstats b.dn,.dn{color:var(--bad)}
.nxt{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}.nmh{display:flex;justify-content:space-between;align-items:center}.nmn{margin-top:2px}
details summary{cursor:pointer;color:var(--mu);font-size:12px;margin-top:8px}
.quest{min-width:0}.quest .qb{min-width:0}.nh>span{min-width:0;overflow-wrap:anywhere}
.grp table{width:100%;table-layout:fixed}.grp td{overflow-wrap:anywhere}.grp td:last-child{width:64px;text-align:right}
@media(max-width:560px){.skgrid{grid-template-columns:1fr}.tt input{width:60px}}

.todo{display:flex;gap:10px;align-items:center;background:var(--p2);border:1px solid var(--line);border-left:3px solid var(--gc,var(--line));border-radius:2px;padding:8px 10px;margin-bottom:6px}
.todo .tdx{flex:1;min-width:0}.todo .tdt{overflow-wrap:anywhere}.todo.done .tdt{color:var(--mu);text-decoration:line-through}
.tdm{display:flex;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin-top:2px}.warnc{color:var(--warn)}
.chp.pri2{background:var(--ac);border-color:var(--ac);color:#0b1016;font-weight:600}
details.card summary{cursor:pointer;color:var(--mu);margin:0}

.btabs{display:none}
.morebtn{display:block;width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:8px}
.morebtn small{display:block;margin-top:2px}
@media (max-width:640px){
  body{font-size:14px;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  #app{padding:8px 10px 24px}
  .tabs{display:none}
  .btabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--p1);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
  .btabs button{flex:1;background:none;border:0;border-top:3px solid transparent;color:var(--mu);padding:14px 2px 12px;font-size:12px;min-width:0}
  .btabs button.on{color:var(--tx);border-top-color:var(--ac)}
  input,select,textarea{font-size:16px}
  input[type=number]{width:92px}
  .btn,.chp{min-height:40px;padding:6px 12px}.btn.sm{min-height:34px}
  .chp.r{min-width:34px}
  .top{padding:2px 0 10px;gap:8px}
  .brand{font-size:14px}
  .datenav{width:100%}.datenav button,.datenav input{min-height:40px}.datenav .today{flex:1}.datenav input[type=date]{width:44px;padding:0;color:transparent;overflow:hidden}.datenav input[type=date]::-webkit-calendar-picker-indicator{color:var(--tx);opacity:1;margin:0 auto}
  .chips{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.chip{padding:4px 6px;text-align:center;font-size:11px}.chip b{display:block;margin:0;font-size:14px}
  .g2,.g3{grid-template-columns:1fr}
  .card{padding:12px}
  /* check-in: stacked rows, hints hidden to stay light */
  .slots{position:sticky;top:0;z-index:30;background:var(--bg);padding:6px 0;margin:0 0 8px;gap:4px}
  .slots button{padding:7px 2px;font-size:12px;min-width:0}.slots button small{font-size:10px}
  .ind{display:block;padding:10px}
  .il{min-width:0}.il small{display:none}.il small.any{display:none}
  .il b{margin-bottom:6px}
  .ctl{justify-content:flex-start;gap:6px}
  .ctl .xp{margin-left:auto}
  .sub{justify-content:flex-start}
  .slotlabel{display:none}.slotpane>.hint{display:none}
  .grp>h3{position:static}
  .md{padding:14px}.ov{padding:2vh 8px}
  .fld{grid-template-columns:1fr}
  /* plan table becomes a list */
  table.plan,table.plan tbody,table.plan tr,table.plan td{display:block;width:auto!important}
  table.plan tr{border-left:3px solid var(--gc,var(--line));padding:6px 8px;margin-bottom:4px;background:var(--p2)}
  table.plan td{border:0!important;padding:1px 0!important}table.plan td.tm{border-left:0!important;color:var(--ac)}table.plan td.tg{display:none}
  .recs .tag{display:none}
  #toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  .todo{padding:10px}
  .scroll{margin:0 -4px}
  .savebar{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom));z-index:20;background:var(--bg);padding:8px 0;border-top:1px solid var(--line)}
}
@media (max-width:640px){.state{display:block;margin:2px 0 0;white-space:normal}.grp td:first-child{white-space:normal}}
@media (max-width:640px){
  .savebar{bottom:calc(47px + env(safe-area-inset-bottom));flex-wrap:nowrap;gap:6px;margin-top:6px!important}
  .savebar .mu{display:none}.savebar .btn.pri{flex:1}
  .brand span{display:none}.top{padding-bottom:8px}
  .banner{padding:6px 10px;font-size:12px}
}

.syncst{margin-left:10px;font-size:11px;border:1px solid var(--line2);padding:1px 7px;color:var(--mu);cursor:pointer}
.syncst.ok{color:var(--ok);border-color:#35563e}.syncst.bad{color:var(--warn);border-color:#7a6535}
@media (max-width:640px){.brand span.syncst{display:inline}}

.mom{border-left:3px solid var(--ac);padding-left:10px}
.momh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.momh span{color:var(--mu);font-size:12px}
.momt{display:flex;gap:6px;margin-top:6px}.momt i{flex:1;font-style:normal;text-align:center;border:1px solid var(--line);background:#0a0c0f;color:var(--mu);padding:4px 2px;font-size:12px}
.momt i b{display:block;font-size:11px;font-weight:400}.momt i.on{background:var(--ok);border-color:var(--ok);color:#0b1016;font-weight:600}

/* check-in v2.6: compact activity panels, chip rows, collapsed day settings */
.act{background:var(--p1);border:1px solid var(--line);border-left:3px solid var(--gc,var(--line));border-radius:2px;margin-bottom:6px}
.act.has{border-color:var(--line2);border-left-color:var(--gc,var(--ac))}
.actb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.actb b{flex:0 0 74px;font-weight:600}
.actb .unit{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.car{width:7px;height:7px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin:0 4px 3px 0;transition:transform .15s}
.act.open .car{transform:rotate(-135deg);margin-bottom:-3px}
.actp{padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.actp select{width:100%}
.actp .ctl{justify-content:flex-start;flex:none}
.ind.chips .ctl{justify-content:flex-start;flex:1 1 100%}
details.ds{margin-bottom:12px;padding:8px 12px}
details.ds summary{margin:0}
.ptot b{color:var(--tx,inherit)}

</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<script>
/* Life Tracker engine: pure JS, no DOM. Replays the daily logs into XP, levels, form and bars. */
(function (root) {
'use strict';

/* ---------- helpers ---------- */
const DAY = 86400000;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fd = dt => dt.toISOString().slice(0, 10);
const addDays = (s, n) => fd(new Date(pd(s).getTime() + n * DAY));
const diffDays = (a, b) => Math.round((pd(a) - pd(b)) / DAY);
const dowOf = s => pd(s).getUTCDay();                       // 0 = Sunday
const weekStart = s => addDays(s, -((dowOf(s) + 6) % 7));    // Monday
const monthOf = s => s.slice(0, 7);
const lastOfMonth = ym => { const [y, m] = ym.split('-').map(Number); return fd(new Date(Date.UTC(y, m, 0))); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const num = x => (x === undefined || x === null || x === '' || isNaN(Number(x))) ? null : Number(x);
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

/* ---------- levelling curve ---------- */
const DEFAULT_CURVE = { a: 17, p: 2.0, b: 0, c: 20 };
const _tables = {};
function levelTable(curve) {
  const key = JSON.stringify(curve);
  if (_tables[key]) return _tables[key];
  const t = [0, 0];
  for (let L = 2; L <= 99; L++) {
    const n = L - 1;
    t[L] = Math.round(curve.a * Math.pow(n, curve.p) + (curve.b || 0) * (Math.pow(2, n / (curve.c || 20)) - 1));
  }
  return (_tables[key] = t);
}
function levelInfo(xp, curve) {
  const t = levelTable(curve || DEFAULT_CURVE);
  let L = 1; while (L < 99 && t[L + 1] <= xp) L++;
  const cur = t[L], next = L < 99 ? t[L + 1] : null;
  return { level: L, xp, cur, next, into: xp - cur, need: next ? next - cur : 0, pct: next ? (xp - cur) / (next - cur) : 1 };
}

/* Momentum: every to-do finished on a day lifts that day's positive habit XP (to-do XP itself is not boosted). */
const MOMENTUM = [0, 0.10, 0.18, 0.25];
const momentumFor = (n, S) => { const t = (S && S.momentum) || MOMENTUM; return t[Math.max(0, Math.min(n, t.length - 1))] || 0; };
function upgradeConfig(cfg) {
  if (!cfg || (cfg.rev || 0) >= REV) return cfg;
  const def = defaultConfig(), byId = {}; def.indicators.forEach(i => { byId[i.id] = i; });
  const from = cfg.rev || 0;
  if (from < 6) { const b = (cfg.indicators || []).find(i => i.id === 'meal_b'); if (b && b.slot === 'afternoon') b.slot = 'morning'; }
  if (from < 5 && cfg.settings) { cfg.settings.rhythm = cfg.settings.rhythm || {}; if (cfg.settings.rhythm[5] == null) cfg.settings.rhythm[5] = 'cheat'; cfg.settings.cheatFrom = cfg.settings.cheatFrom || '17:00'; }
  if (from < 4 && !(cfg.indicators || []).some(i => i.id === 'stretch_ham')) { const ni = JSON.parse(JSON.stringify(byId.stretch_ham)), at = (cfg.indicators || []).findIndex(i => i.id === 'walk'); if (at >= 0) cfg.indicators.splice(at, 0, ni); else cfg.indicators.push(ni); }
  if (from < 3) for (const i of (cfg.indicators || [])) {
    const d = byId[i.id]; if (!d) continue;
    if (['supp_protein', 'supp_mag', 'outfit'].includes(i.id)) i.slot = d.slot;
    if (d.slots) i.slots = d.slots.slice();
    if (i.kind === 'tier' && d.kind === 'tier') { for (const o of d.options) { const mine = (i.options || []).find(x => x.id === o.id); if (mine) mine.label = o.label; } }
    if (i.kind === 'rooms' && d.kind === 'rooms') {
      for (const r of d.rooms) { const mine = i.rooms.find(x => x.id === r.id); if (mine) { mine.decay = r.decay; mine.w = r.w; } else i.rooms.push(Object.assign({}, r)); }
      for (const t of d.tasks) { const mine = i.tasks.find(x => x.id === t.id); if (mine) mine.xp = t.xp; else i.tasks.push(Object.assign({}, t, { fill: Object.assign({}, t.fill) })); }
      i.taskXpScale = d.taskXpScale;
    }
  }
  cfg.rev = REV; return cfg;
}

const KIND_META = {
  binary: { bad: true }, zone: { bad: true }, ceil: { bad: true }, tier: { bad: true }, time: { bad: true },
  effort: { bad: true }, bar: { bad: true }, macros: {}, rating: {}, amount: {}, cashflow: { bad: true }, foodcost: {}, rooms: { always: true },

};

function zoneScore(x, lo, hi, mn, mx) {
  if (x >= lo && x <= hi) return 1;
  if (x < lo) { const t = (x - mn) / (lo - mn); return t >= 0 ? t : Math.max(-0.4, t * 0.4); }
  const t = (mx - x) / (mx - hi); return t >= 0 ? t : Math.max(-0.4, t * 0.4);
}
function ceilScore(x, ideal, zero, bad) {
  if (x <= ideal) return 1;
  if (x <= zero) return 1 - (x - ideal) / (zero - ideal);
  if (x <= bad) return -0.4 * (x - zero) / (bad - zero);
  return -0.4;
}

H.tier = (ind, c) => {

H.time = (ind, c) => {

H.effort = (ind, c) => {

H.bar = (ind, c) => {

H.macros = (ind, c) => {

H.count = (ind, c) => {

function weightScore(rate, phase) {
  if (phase === 'bulk') return rate >= 0.1 && rate <= 0.5 ? 1 : (rate > 0 && rate < 0.1) || (rate > 0.5 && rate < 0.8) ? 0.5 : rate >= 0.8 ? 0.1 : -0.1;

  if (rate < -1.0) return rate >= -1.5 ? 0.3 : -0.1;
  if (rate < 0) return 0.5;
  return rate <= 0.3 ? 0 : -0.2;

/* ---------- normalisation: every skill hands out ~skillBudget XP on a perfect day ---------- */
function normalise(cfg) {
  const B = cfg.settings.skillBudget, req = {}, all = {}, full = {};
  for (const i of cfg.indicators) {
    if (i.off) continue;
    all[i.skill] = (all[i.skill] || 0) + i.w;
    if (!i.optional && !i.abs) req[i.skill] = (req[i.skill] || 0) + i.w;
  }
  for (const i of cfg.indicators) { const den = req[i.skill] || all[i.skill] || 1; full[i.id] = B * i.w / den; }

function compute(state, opts) {

  const FULL = normalise(cfg);
  const logDates = Object.keys(logs).sort();
  let first = state.startDate || logDates[0] || today;
  if (logDates[0] && logDates[0] < first) first = logDates[0];
  if (first > today) first = today;

  const T = { weekCount: {}, weekWaive: 0, treatsLeft: S.treatsPerWeek, funLeft: 0, lastDone: {}, need: {}, tokensUsed: 0,
    rooms: {}, hist: { rating: {}, weight: {}, workout: {} } };
  const days = {};
  let prevType = 'normal';

  for (let d = first; d <= today; d = addDays(d, 1)) {
    const dw = dowOf(d);
    if (dw === 1) { T.weekCount = {}; T.weekWaive = 0; T.treatsLeft = S.treatsPerWeek; }
    if (d.slice(8) === '01') T.tokensUsed = 0;
    const day = logs[d] || {}, v = day.v || {};

    const mode = day.mode || 'normal';

      else slots[sl] = { logged: false, delay: null, factor: 1 };
    }

    const ctx = { d, v, S, T, dayType, prevDayType: prevType, waive, tScale: waive ? (S.modeScale[mode] || 1) : 1,

    for (const ind of inds) {

      let sl = slots[ind.slot] || { logged: false, factor: 1 }, partial = false;
      if (!sl.logged && ind.slots && ind.slots.length > 1 && (ind.id in v)) {

      if (partial && isToday && r.xp < 0) r = { xp: 0, state: 'pending' };
      if (r.xp < 0 && waive) { r = { xp: 0, state: 'waived', note: r.note }; }
      const f = (r.xp > 0 && !meta.always) ? sl.factor : 1;
      out[ind.id] = { xp: r.xp * f, raw: r.xp, f, state: r.state, note: r.note || '', skill: ind.skill };
      if (f < 1) out[ind.id].note += (out[ind.id].note ? ', ' : '') + 'backfill ×' + f;
      if (ind.id === 'workout' && ctx.sess) out[ind.id].sess = ctx.sess;
    }

    for (const ind of inds) {

      const tgt = out[ind.modifies.id]; if (!tgt) continue;
      let mult = ind.modifies.mult; if (ind.funHalf && prevType === 'fun') mult = (1 + mult) / 2;
      if (tgt.xp > 0) { tgt.note += (tgt.note ? ', ' : '') + 'non-sober ×' + mult.toFixed(2); tgt.xp *= mult; }
    }

    // daily priority (counts only if the morning check-in was done on the day itself)

    if (day.priority && out[day.priority] && slots.morning.logged && slots.morning.delay === 0 && out[day.priority].xp > 0) {
      const o = out[day.priority];

    }

        if ((ind.kind === 'count' && !ind.abs) || ind.kind === 'workout') {

          if (eff >= 1) {
            const cnt = T.weekCount[ind.id] || 0, pot = FULL[ind.id] * 7;
            const pen = cnt === 0 ? -0.2 * pot : cnt / eff < 0.5 ? -0.08 * pot : 0;
            if (pen) { o.xp += pen; o.note += (o.note ? ', ' : '') + 'weekly goal missed (' + cnt + '/' + ind.goal + ')'; o.weeklyPen = pen; }
          }
        }

          const prev = h.filter(e => e.d <= addDays(d, -7) && e.d > addDays(d, -14)).map(e => e.v);
          if (cur.length >= 3 && prev.length >= 3) {
            const rate = (mean(cur) / mean(prev) - 1) * 100;
            const s = weightScore(rate, S.phase);
            const xp = FULL[ind.id] * 7 * s;
            o.xp += (xp > 0 && waive) ? xp : (xp < 0 && waive ? 0 : xp);
            o.note += (o.note ? ', ' : '') + 'weekly trend ' + (rate >= 0 ? '+' : '') + rate.toFixed(2) + '%';
          }

      }
    }

      if (ind && rec && num(rec.net) > 0 && num(rec.saved) != null) {
        const rate = rec.saved / rec.net;
        const s = rate >= 0 ? Math.min(rate / (ind.target || 0.3), 1) : Math.max(rate / (ind.target || 0.3), -0.4);

      if (miss(r1) && miss(r2)) {

    // accumulate per skill

  const all = series.flatMap(s => s.pts.filter(p => p[1] != null)); if (!all.length) return '<p class="mu">Not enough data yet.</p>';
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  let y0 = opts.yMin != null ? opts.yMin : Math.min(...ys), y1 = opts.yMax != null ? opts.yMax : Math.max(...ys);
  if (y1 - y0 < 1e-6) { y0 -= 1; y1 += 1; }
  const X = x => P + (x - x0) / (x1 - x0) * (W - P - 6), Y = y => H - 14 - (y - y0) / (y1 - y0) * (H - 28);
  let g = '<line x1="' + P + '" x2="' + W + '" y1="' + Y(y0) + '" y2="' + Y(y0) + '" stroke="#2a2f37"/>';
  g += '<text x="2" y="' + (Y(y1) + 4) + '" fill="#8a929e" font-size="10">' + (+y1.toFixed(1)) + '</text><text x="2" y="' + (Y(y0) + 4) + '" fill="#8a929e" font-size="10">' + (+y0.toFixed(1)) + '</text>';
  for (const s of series) {
    let d = ''; let pen = false;
    for (const p of s.pts) { if (p[1] == null) continue; d += (pen ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1); pen = true; }
    g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.w || 1.6) + '" stroke-linejoin="round"/>';
    if (s.dots) for (const pt of s.pts) if (pt[1] != null) g += '<rect x="' + (X(pt[0]) - 2).toFixed(1) + '" y="' + (Y(pt[1]) - 2).toFixed(1) + '" width="4" height="4" fill="' + s.color + '"/>';
  }
  const lg = series.filter(s => s.name).map(s => '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>').join('');
  return '<svg class="chart" style="height:' + H + 'px" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + g + '</svg>' + (lg ? '<div class="legend">' + lg + '</div>' : '');
}

    if (td.reward || lv) openModal('<h2>To-do done</h2><p><b>' + esc(td.text) + '</b></p><div class="big pos">+' + todoXp(td) + ' XP</div>' + (lv ? '<div class="lvup">' + esc((skillOf(td.skill) || {}).name) + ' reached level ' + res.skills[td.skill].level + '</div>' : '') + (td.reward ? '<p>Your reward: <b>' + esc(td.reward) + '</b></p>' : '') + '<button class="btn pri" data-act="closeModal">Nice</button>'); else toast('+' + todoXp(td) + ' XP, momentum ' + (res.days[TODAY].momentum ? '+' + Math.round(res.days[TODAY].momentum * 100) + '%' : 'off'));
    render();
  },
  undoTodo: t => { const td = state.todos.find(x => x.id === t.dataset.id); if (!td) return; td.done = null; state.bonuses = state.bonuses.filter(b => b.todo !== td.id); persist(); },
  delTodo: t => { const td = state.todos.find(x => x.id === t.dataset.id); if (!td) return; if (td.done && !confirm('Delete a finished to-do? Its XP is removed too.')) return; state.bonuses = state.bonuses.filter(b => b.todo !== td.id); state.todos = state.todos.filter(x => x.id !== td.id); persist(); },
  clearSlot: () => { delete getDay(ui.date).slots[ui.slot]; persist(); },
  modeRange: () => { const n = Math.max(1, Math.min(60, Number($('#mrN').value) || 1)), m = $('#mrM').value; for (let i = 0; i < n; i++) { const d = E.addDays(ui.date, i); getDay(d).mode = m; } persist(); toast('Mode "' + m + '" set for ' + n + ' day(s)'); },
  claim: t => { const q = cfg().quests.find(x => x.id === t.dataset.id); if (q && E.claimQuest(state, q, ui.date)) { persist(); openModal('<h2>Milestone complete</h2><p><b>' + esc(q.name) + '</b></p><p>' + (q.reward ? 'Your reward: <b>' + esc(q.reward) + '</b>' : 'No reward was set for this one. You can add one when editing it.') + '</p>' + (q.xp ? '<div class="lvup">+' + q.xp + ' bonus XP</div>' : '') + '<button class="btn pri" data-act="closeModal">Claimed</button>'); } },
  closeModal: closeModal,
  ovclick: (t, e) => { if (e.target === t) closeModal(); },
  startFresh: () => { state.welcomed = true; persist(); },
  startDemo: () => { ACT.loadDemoWith('consistent', 90); },
  loadDemo: () => ACT.loadDemoWith(ui.simPersona, ui.simDays),

  },
  exitDemo: () => { appMode = 'real'; lsSet(KEYS.mode, 'real'); state = loadState(); syncRebase(); ui.date = TODAY; render(); syncNow(); },
  simp: t => { ui.simPersona = t.dataset.id; render(); },

  resetCurve: () => { S_().curve = Object.assign({}, E.DEFAULT_CURVE); persist(); },
  export: () => {

    if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) { navigator.share({ files: [file], title: 'Life Tracker backup' }).then(() => toast('Backup shared'), e => { if (e && e.name !== 'AbortError') toast('Sharing failed, use Download instead'); }); render(); return; }
    ACT.download();
  },
  download: () => { state.lastBackup = TODAY; save(); const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'life-tracker-backup-' + TODAY + '.json'; document.body.appendChild(a); a.click(); a.remove(); render(); toast('Backup downloaded'); },
  importBtn: () => $('#impFile').click(),
  reset: () => { if (confirm('Delete ALL data in this browser and start over?' + (syncSigned() ? ' You are signed in to sync, so the cloud copy will restore it on the next sync. Sign out first to truly start over.' : ' Export a backup first if unsure.'))) { state = E.defaultState(TODAY); persist(); toast('Reset done'); } },
  newInd: () => openModal('<h2>New indicator</h2><p class="mu">Pick the kind of thing you want to track:</p><div class="grid">' + Object.entries(TPL).map(([k, v]) => '<button class="persona" data-act="pickTpl" data-id="' + k + '"><b>' + v[0] + '</b></button>').join('') + '</div><div class="row" style="margin-top:12px"><button class="btn" data-act="closeModal">Cancel</button></div>'),
  pickTpl: t => { const k = t.dataset.id, base = Object.assign({ id: rid('c'), name: '', skill: cfg().skills[0].id, slot: 'afternoon', w: 1, off: false, optional: false }, TPL[k][1]()); openModal(indForm(base, true, k)); },
  editInd: t => { const ind = indOf(t.dataset.id); if (ind) openModal(indForm(ind, false)); },
  saveInd: () => {
    const f = $('#mform'), isNew = f.dataset.new === '1'; let ind = isNew ? null : indOf(f.dataset.id);
    if (isNew) { ind = Object.assign({ id: f.dataset.id, off: false, optional: false, w: 1 }, TPL[f.dataset.tpl][1]()); }

    ind.name = name; ind.skill = fv('skill'); ind.slot = fv('slot'); ind.off = !fv('on');
    { const chk = E.SLOTS.filter(s => fv('sl_' + s)); if (chk.length <= 1) { if (chk.length) ind.slot = chk[0]; delete ind.slots; } else { ind.slots = chk; if (!chk.includes(ind.slot)) ind.slot = chk[0]; } }
    const nm = (n, key) => { const x = fv(n); if (x !== undefined && x !== '') ind[key || n] = Number(x); };
    if (!ind.abs) nm('w'); ['target', 'everyN', 'lo', 'hi', 'min', 'max', 'ideal', 'zero', 'bad', 'goal', 'unitXp', 'dayCap'].forEach(n => nm(n));
    if (fv('unit') !== undefined) ind.unit = fv('unit'); if (fv('relax') !== undefined) ind.relax = fv('relax'); if (fv('noPenalty') !== undefined) ind.noPenalty = fv('noPenalty'); if (fv('optional') !== undefined) ind.optional = fv('optional'); if (fv('cost') !== undefined) ind.cost = fv('cost');
    if (ind.kind === 'effort') ind.def = ind.target;
    if (isNew) cfg().indicators.push(ind);
    closeModal(); persist(); toast(isNew ? 'Indicator added, the skill XP was rebalanced' : 'Saved');
  },
  delInd: t => { if (confirm('Delete this indicator? Past XP stays; you can also just disable it.')) { cfg().indicators = cfg().indicators.filter(i => i.id !== t.dataset.id); closeModal(); persist(); } },
  newQuest: () => openModal(questForm({ id: rid('q'), name: '', reward: '', metric: { type: 'days', ind: 'workout' }, target: 10, period: 'month', xp: 200, skill: cfg().skills[0].id }, true)),
  editQuest: t => { const q = cfg().quests.find(x => x.id === t.dataset.id); if (q) openModal(questForm(q, false)); },
  saveQuest: () => {
    const f = $('#mform'), isNew = f.dataset.new === '1'; const q = isNew ? { id: f.dataset.id } : cfg().quests.find(x => x.id === f.dataset.id);
    if (!(fv('name') || '').trim()) { toast('Give it a name'); return; }
    const old = isNew ? null : q.metric, t = fv('mtype'), m = { type: t };
    if (t === 'level') m.skill = fv('mskill'); else if (t !== 'meta') m.ind = fv('mind');
    if (t === 'meta') m.ids = Array.from($('#mform').elements.mids.selectedOptions).map(o => o.value);
    if (t === 'days') { if (fv('op')) { m.op = fv('op'); m.val = Number(fv('val')); if (m.op === '==' && (m.val === 0 || m.val === 1)) m.val = m.val === 1; } if (fv('weekdays')) m.weekdays = true; const all = []; for (let n = 1; n <= 3; n++) { const ci = fv('c' + n + 'ind'); if (!ci) continue; const op = fv('c' + n + 'op') || '>='; let val = Number(fv('c' + n + 'val')); if (op === '==' && (val === 0 || val === 1)) val = val === 1; all.push({ ind: ci, op, val }); } if (all.length) m.all = all; }
    if (t === 'wk_best') { m.field = fv('field') || 'load'; if (fv('wtype')) m.wtype = fv('wtype'); }
    if (t === 'wk_count' || t === 'weeks') { if (fv('wtype')) m.wtype = fv('wtype'); if (t === 'weeks') m.min = Number(fv('minper')) || 1; }
    Object.assign(q, { name: fv('name').trim(), reward: fv('reward') || '', metric: m, target: Number(fv('target')) || (t === 'meta' ? m.ids.length : 1), period: fv('period'), xp: Number(fv('xp')) || 0, skill: fv('skill') });
    if (isNew) cfg().quests.push(q); closeModal(); persist();
  },
  delQuest: t => { if (confirm('Delete this milestone?')) { cfg().quests = cfg().quests.filter(q => q.id !== t.dataset.id); closeModal(); persist(); } },
  newSkill: () => openModal(skillForm({ id: rid('s'), name: '', group: 'Lifestyle' }, true)),
  editSkill: t => { const s = skillOf(t.dataset.id); if (s) openModal(skillForm(s, false)); },
  saveSkill: () => {
    const f = $('#mform'), isNew = f.dataset.new === '1'; const s = isNew ? { id: f.dataset.id } : skillOf(f.dataset.id);
    if (!(fv('name') || '').trim()) { toast('Give it a name'); return; }
    Object.assign(s, { name: fv('name').trim(), group: fv('group') || 'Lifestyle' }); if (isNew) cfg().skills.push(s); closeModal(); persist();
  },
  delSkill: t => { const used = cfg().indicators.some(i => i.skill === t.dataset.id); if (used) { toast('Move or delete its indicators first'); return; } if (confirm('Delete this skill and its XP history?')) { cfg().skills = cfg().skills.filter(s => s.id !== t.dataset.id); closeModal(); persist(); } },
  newRoom: () => openModal('<h2>New room</h2><form id="mform"><div class="fld">' + fld('Name', 'name', '') + fld('Needs cleaning every (days)', 'days', 7, 'number', 'min="1"') + fld('Weight', 'w', 1, 'number', 'step="0.5" min="0.5"') + '</div></form><div class="row"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="saveRoom">Add</button></div>'),
  saveRoom: () => { const n = (fv('name') || '').trim(); if (!n) { toast('Give it a name'); return; } homeInd().rooms.push({ id: rid('r'), name: n, decay: Math.round(5000 / (Number(fv('days')) || 7)) / 100, w: Number(fv('w')) || 1, start: 70 }); closeModal(); persist(); },
  delRoom: t => { const h = homeInd(); if (h.rooms.length <= 1) { toast('Keep at least one room'); return; } h.rooms = h.rooms.filter(r => r.id !== t.dataset.id); h.tasks.forEach(k => delete k.fill[t.dataset.id]); persist(); },
  newTask: () => openModal('<h2>New household task</h2><form id="mform"><div class="fld">' + fld('Label', 'label', '') + fld('XP', 'xp', 10, 'number') + fld('Fills (room:points)', 'fill', '', 'text', 'placeholder="kitchen:60, hallway:20"') + '</div></form><p class="hint">Rooms: ' + esc(homeInd().rooms.map(r => r.name).join(', ')) + '</p><div class="row"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="saveTask">Add</button></div>'),
  saveTask: () => { const l = (fv('label') || '').trim(); if (!l) { toast('Give it a label'); return; } const h = homeInd(); const fill = parseFill(fv('fill'), h); if (!Object.keys(fill).length) { toast('List at least one room, e.g. kitchen:60'); return; } h.tasks.push({ id: rid('t'), label: l, xp: Number(fv('xp')) || 0, fill }); closeModal(); persist(); },
  delTask: t => { const h = homeInd(); h.tasks = h.tasks.filter(k => k.id !== t.dataset.id); persist(); }
};
const INP = {
  actsel: t => { ui.actSel[t.dataset.cat] = t.value; render(); },
  date: t => { if (t.value && t.value <= TODAY) { ui.date = t.value; render(); } },
  time: t => { const day = getDay(ui.date); if (t.value.trim() === '') { delete day.v[t.dataset.id]; persist(); return; } const p = parseTime(t.value); if (!p) { toast('Could not read that time. Try 10:30 or 1030.'); render(); return; } day.v[t.dataset.id] = p; persist(); },
  cfgtime: t => { const p = parseTime(t.value); if (!p) { toast('Could not read that time. Try 07:30 or 0730.'); render(); return; } S_()[t.dataset.path] = p; persist(); },
  part: t => { const day = getDay(ui.date), ind = indOf(t.dataset.id); if (!ind) return; setPart(day, ind, t.dataset.slot, t.value === '' ? null : Number(t.value)); persist(); },
  num: t => { const day = getDay(ui.date); if (t.value === '') delete day.v[t.dataset.id]; else day.v[t.dataset.id] = Number(t.value); persist(); },
  str: t => { const day = getDay(ui.date); if (!t.value) delete day.v[t.dataset.id]; else day.v[t.dataset.id] = t.value; persist(); },
  note: t => { getDay(ui.date).note = t.value; persist(); },
  mode: t => { getDay(ui.date).mode = t.value; persist(); },
  priority: t => { getDay(ui.date).priority = t.value || null; persist(); },
  token: t => { getDay(ui.date).token = t.checked; persist(); },
  wmin: t => { const day = getDay(ui.date), w = day.v.workout; if (!w) return; if (t.value === '' || Number(t.value) <= 0) delete day.v.workout; else w.min = Number(t.value); persist(); },
  wload: t => { const w = getDay(ui.date).v.workout; if (!w) return; if (t.value === '') delete w.load; else w.load = Number(t.value); persist(); },
  wsquat: t => { const w = getDay(ui.date).v.workout; if (!w) return; if (t.value === '') delete w.squat; else w.squat = Number(t.value); persist(); },
  mac: t => { const day = getDay(ui.date), m = day.v.macros || {}; if (t.value === '') delete m[t.dataset.k]; else m[t.dataset.k] = Number(t.value); if (Object.keys(m).length) day.v.macros = m; else delete day.v.macros; persist(); },
  month: t => { const ym = E.monthOf(ui.date), m = state.months[ym] || {}; if (t.value === '') delete m[t.dataset.k]; else m[t.dataset.k] = Number(t.value); state.months[ym] = m; persist(); },
  simdays: t => { ui.simDays = Number(t.value); render(); },
  rhythm: t => { const S = S_(); if (t.value === 'normal') delete S.rhythm[t.dataset.id]; else S.rhythm[t.dataset.id] = t.value; persist(); },
  room: t => { const r = homeInd().rooms.find(x => x.id === t.dataset.id); if (!r) return; const k = t.dataset.k; if (k === 'name') { if (t.value.trim()) r.name = t.value.trim(); } else { const n = Number(t.value); if (isFinite(n) && n > 0) { if (k === 'days') r.decay = Math.round(5000 / n) / 100; else r[k] = n; } } persist(); },
  task: t => { const k = homeInd().tasks.find(x => x.id === t.dataset.id); if (!k) return; if (t.dataset.k === 'label') { if (t.value.trim()) k.label = t.value.trim(); } else { const n = Number(t.value); if (isFinite(n)) k[t.dataset.k] = n; } persist(); },
  taskfill: t => { const h = homeInd(), k = h.tasks.find(x => x.id === t.dataset.id); if (!k) return; const f = parseFill(t.value, h); if (Object.keys(f).length) k.fill = f; else toast('Use room:points, for example kitchen:60'); persist(); },
  cfg: t => {
    const S = S_(), path = t.dataset.path.split('.'); let o = S; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    const v = t.dataset.type === 'num' ? Number(t.value) : t.value; if (t.dataset.type === 'num' && !isFinite(v)) return; o[path[path.length - 1]] = v; persist();
  },
  importFile: t => {
    const f = t.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { try { const s = JSON.parse(rd.result); if (!s.config || !s.logs) throw new Error('not a Life Tracker backup'); if (!(s.v >= 2)) throw new Error('this backup is from the first version and cannot be imported'); if (!confirm('Replace the current data with this backup?')) return; state = migrate(s); appMode = 'real'; lsSet(KEYS.mode, 'real'); persist(); toast('Backup imported'); } catch (e) { toast('Import failed: ' + e.message); } };
    rd.readAsText(f); t.value = '';
  }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const f = ACT[t.dataset.act]; if (f) f(t, e); });
document.addEventListener('change', e => { const t = e.target.closest('[data-in]'); if (!t) return; const f = INP[t.dataset.in]; if (f) f(t, e); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'tdText') ACT.addTodo(); if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

Object.assign(ACT, SYNC_ACT);
state = loadState();
render();
syncInit();
window.__lifetracker = { get state() { return state; }, get res() { return res; }, ui, ACT, INP, render };
})();
